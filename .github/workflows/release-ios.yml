name: iOS Release to TestFlight

# Triggers on version tags (e.g. git tag v1.0.0 && git push --tags)
# or manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Decode Firebase config files
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Code Signing ────────────────────────────────────────────────────────
      # Requires these GitHub repository secrets:
      #   DISTRIBUTION_CERTIFICATE_BASE64   — .p12 distribution cert, base64-encoded
      #                                        export from Keychain Access, encode: base64 -i cert.p12 | pbcopy
      #   DISTRIBUTION_CERTIFICATE_PASSWORD — password you set when exporting the .p12
      #   PROVISIONING_PROFILE_BASE64       — App Store provisioning profile (.mobileprovision), base64-encoded
      #                                        download from developer.apple.com, encode: base64 -i profile.mobileprovision | pbcopy
      # ────────────────────────────────────────────────────────────────────────
      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build iOS archive
        run: |
          flutter build ios --release --no-codesign
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=GMAMAXJ88G

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      # ── Upload to TestFlight ─────────────────────────────────────────────────
      # Requires these GitHub repository secrets:
      #   APP_STORE_CONNECT_KEY_ID        — Key ID (e.g. ABC123XYZ)
      #   APP_STORE_CONNECT_ISSUER_ID     — Issuer ID (UUID from App Store Connect → Users & Access → Keys)
      #   APP_STORE_CONNECT_KEY_BASE64    — .p8 API key file, base64-encoded
      #                                     download from App Store Connect, encode: base64 -i AuthKey_XXXX.p8 | pbcopy
      # ────────────────────────────────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$(find $RUNNER_TEMP/export -name '*.ipa' | head -1)" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --apiKeyPath "$API_KEY_PATH"

      # ── Cleanup ──────────────────────────────────────────────────────────────
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
