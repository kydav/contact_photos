    ID: 2,
    Title: "Create a widget in it's own file specifically for querying companies",
    Goal:
      "This widget will have an input field and will allow the user to input a company name and then hit enter or tap a button to search for companies.
      This widget will also use the firebase gemini api to query for companies based on the search query and return a list of possible companies that match the search query.
      the widget will show the possible companies that match the search query and allow the user to select one of them. Each company will have a name, and a website url.
      The website url can be tapped, to open a website in app webview to make sure that is the correct company.
      The user can tap on the company URl button to view the website or each row will have a select button that will allow the user to select the company and then the widget will return the company name and website url to the parent widget.",
    Acceptance Criteria: "A widget is created in its own file that allows the user to search for companies and select one of them. The widget returns the company name and website url to the parent widget. Include this search widget in the home page",
    Out Of Scope: "handling the selected company in the parent widget, implementing any new features for the company search widget",
  },
